[package]
name = "tether"
version = "0.1.0"
edition = "2021"

[lib]
name = "tether"
path = "rust_core/src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module"] }
tokio = { version = "1", features = ["full"] }
memmap2 = "0.9"
dashmap = "5.5"
crossbeam = "0.8"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
