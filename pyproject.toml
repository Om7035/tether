[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "tether"
version = "0.1.0"
description = "High-performance Rust + Python hybrid storage engine with WAL"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21.0", "black", "ruff"]

[tool.maturin]
module-name = "tether"
python-source = "python_pkg"
